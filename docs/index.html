<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StudyMind — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f5ff;--white:#fff;
  --p50:#faf5ff;--p100:#f3e8ff;--p300:#d8b4fe;--p400:#c084fc;
  --p500:#a855f7;--p600:#9333ea;--p700:#7e22ce;
  --text:#1a0533;--text3:#6b7280;--text4:#9ca3af;
  --green:#059669;--red:#dc2626;
  --border:rgba(139,92,246,0.13);--border2:rgba(139,92,246,0.26);
  --shadow-xl:0 20px 60px rgba(109,40,217,0.18),0 4px 16px rgba(109,40,217,0.1);
  --font-display:"Instrument Serif",serif;
  --font-body:"Plus Jakarta Sans",sans-serif;
}
html{font-size:15px;background:var(--bg)}
body{font-family:var(--font-body);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 15% 10%,rgba(167,139,250,0.2) 0%,transparent 55%),radial-gradient(ellipse 60% 50% at 85% 5%,rgba(216,180,254,0.18) 0%,transparent 50%),radial-gradient(ellipse 80% 40% at 50% 90%,rgba(139,92,246,0.12) 0%,transparent 60%);pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;animation:float 8s ease-in-out infinite}
.orb1{width:300px;height:300px;background:rgba(168,85,247,0.12);top:-80px;left:-80px;animation-delay:0s}
.orb2{width:200px;height:200px;background:rgba(192,132,252,0.1);bottom:-60px;right:-60px;animation-delay:3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

.card{background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:28px;padding:48px 44px;width:440px;max-width:92vw;box-shadow:var(--shadow-xl);position:relative;z-index:10;animation:cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--p400),transparent)}

.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--p500),var(--p700));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(139,92,246,0.4)}
.logo-text{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--text)}
.logo-text span{background:linear-gradient(135deg,var(--p500),var(--p700));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.tabs{display:flex;background:var(--p50);border-radius:12px;padding:4px;margin-bottom:28px;border:1px solid var(--border)}
.tab{flex:1;padding:9px;border-radius:9px;border:none;background:none;font-family:var(--font-body);font-size:13.5px;font-weight:500;color:var(--text4);cursor:pointer;transition:all 0.15s}
.tab.active{background:var(--white);color:var(--p700);box-shadow:0 1px 4px rgba(109,40,217,0.12)}

.headline{font-family:var(--font-display);font-size:30px;font-weight:500;color:var(--text);margin-bottom:6px;line-height:1.2}
.headline em{font-style:italic;background:linear-gradient(135deg,var(--p500),var(--p700));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subline{font-size:13px;color:var(--text3);margin-bottom:24px;line-height:1.6}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--p50);font-size:13.5px;font-family:var(--font-body);color:var(--text);outline:none;transition:all 0.15s}
.field input:focus{border-color:var(--p400);background:var(--white);box-shadow:0 0 0 3px rgba(168,85,247,0.08)}
.field input.error{border-color:var(--red)}

.submit-btn{width:100%;padding:13px;border-radius:13px;background:linear-gradient(135deg,var(--p500),var(--p700));border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);box-shadow:0 5px 18px rgba(139,92,246,0.35);transition:all 0.2s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.submit-btn:hover{box-shadow:0 7px 24px rgba(139,92,246,0.45);transform:translateY(-1px)}
.submit-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}

.error-msg{background:rgba(220,38,38,0.06);border:1px solid rgba(220,38,38,0.2);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--red);margin-top:12px;display:none}
.error-msg.show{display:block}
.success-msg{background:rgba(5,150,105,0.06);border:1px solid rgba(5,150,105,0.2);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--green);margin-top:12px;display:none}
.success-msg.show{display:block}

.features{display:flex;flex-direction:column;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.feat{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text3)}
.feat-dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,rgba(168,85,247,0.1),rgba(139,92,246,0.07));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:spin 0.8s linear infinite;display:none}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>
    </div>
    <div class="logo-text">Study<span>Mind</span></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
    <button class="tab" id="tab-register" onclick="switchTab('register')">Create Account</button>
  </div>

  <div id="form-login">
    <div class="headline">Welcome <em>back.</em></div>
    <div class="subline">Your flashcards and progress are waiting.</div>
    <div class="field"><label>Username</label><input id="l-username" type="text" placeholder="Enter your username" autocomplete="username"/></div>
    <div class="field"><label>Password</label><input id="l-password" type="password" placeholder="Enter your password" autocomplete="current-password"/></div>
    <button class="submit-btn" id="login-btn" onclick="doLogin()">
      <div class="spinner" id="login-spinner"></div>
      <span id="login-btn-text">Sign In</span>
    </button>
    <div class="error-msg" id="login-error"></div>
  </div>

  <div id="form-register" style="display:none">
    <div class="headline">Start <em>learning.</em></div>
    <div class="subline">Your progress syncs across all your devices.</div>
    <div class="field"><label>Display Name</label><input id="r-name" type="text" placeholder="Your full name"/></div>
    <div class="field"><label>Username</label><input id="r-username" type="text" placeholder="Choose a username" autocomplete="username"/></div>
    <div class="field"><label>Password</label><input id="r-password" type="password" placeholder="Create a password" autocomplete="new-password"/></div>
    <button class="submit-btn" id="register-btn" onclick="doRegister()">
      <div class="spinner" id="register-spinner"></div>
      <span id="register-btn-text">Create Account</span>
    </button>
    <div class="error-msg" id="register-error"></div>
    <div class="success-msg" id="register-success"></div>
  </div>


</div>

<script>
const API = "https://simple-python-script--anshumanbahekar.replit.app";

function switchTab(tab) {
  document.getElementById("form-login").style.display    = tab === "login"    ? "block" : "none";
  document.getElementById("form-register").style.display = tab === "register" ? "block" : "none";
  document.getElementById("tab-login").classList.toggle("active", tab === "login");
  document.getElementById("tab-register").classList.toggle("active", tab === "register");
}

function setLoading(type, loading) {
  document.getElementById(type+"-btn").disabled = loading;
  document.getElementById(type+"-spinner").classList.toggle("show", loading);
  document.getElementById(type+"-btn-text").textContent = loading ? (type === "login" ? "Signing in..." : "Creating...") : (type === "login" ? "Sign In" : "Create Account");
}

function showError(type, msg) {
  const el = document.getElementById(type+"-error");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 4000);
}

async function doLogin() {
  const username = document.getElementById("l-username").value.trim();
  const password = document.getElementById("l-password").value.trim();
  if (!username || !password) { showError("login", "Please enter username and password"); return; }
  setLoading("login", true);
  try {
    const res  = await fetch(API + "/auth/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem("sm_token",        data.token);
      localStorage.setItem("sm_user_id",      data.user_id);
      localStorage.setItem("sm_username",     data.username);
      localStorage.setItem("sm_display_name", data.display_name);
      window.location.href = "dashboard.html";
    } else {
      showError("login", data.error || "Login failed");
    }
  } catch(e) {
    showError("login", "Cannot reach server — is Replit running?");
  }
  setLoading("login", false);
}

async function doRegister() {
  const name     = document.getElementById("r-name").value.trim();
  const username = document.getElementById("r-username").value.trim();
  const password = document.getElementById("r-password").value.trim();
  if (!username || !password) { showError("register", "Username and password required"); return; }
  setLoading("register", true);
  try {
    const res  = await fetch(API + "/auth/register", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, password, display_name: name})
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem("sm_token",        data.token);
      localStorage.setItem("sm_user_id",      data.user_id);
      localStorage.setItem("sm_username",     data.username);
      localStorage.setItem("sm_display_name", data.display_name);
      const s = document.getElementById("register-success");
      s.textContent = data.message; s.classList.add("show");
      setTimeout(() => window.location.href = "dashboard.html", 1000);
    } else {
      showError("register", data.error || "Registration failed");
    }
  } catch(e) {
    showError("register", "Cannot reach server — is Replit running?");
  }
  setLoading("register", false);
}

// Enter key support
document.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem("sm_token")) window.location.href = "dashboard.html";
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const tab = document.getElementById("tab-login").classList.contains("active");
    if (tab) doLogin(); else doRegister();
  });
});
</script>
</body>
</html>
