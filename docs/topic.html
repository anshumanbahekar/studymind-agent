<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StudyMind — Topic Detail</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/10982/10982900.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f5ff;--white:#fff;
  --p50:#faf5ff;--p100:#f3e8ff;--p200:#e9d5ff;--p300:#d8b4fe;
  --p400:#c084fc;--p500:#a855f7;--p600:#9333ea;--p700:#7e22ce;
  --text:#1a0533;--text2:#4c1d95;--text3:#6b7280;--text4:#9ca3af;
  --green:#059669;--green-bg:#ecfdf5;
  --amber:#d97706;--amber-bg:#fffbeb;
  --red:#dc2626;--red-bg:#fef2f2;
  --border:rgba(139,92,246,0.13);--border2:rgba(139,92,246,0.26);
  --shadow:0 1px 3px rgba(109,40,217,0.06),0 4px 16px rgba(109,40,217,0.06);
  --shadow-lg:0 4px 24px rgba(109,40,217,0.1);
  --font-display:'Instrument Serif',serif;
  --font-body:'Plus Jakarta Sans',sans-serif;
}
html{font-size:15px;background:var(--bg)}
body{font-family:var(--font-body);color:var(--text);background:var(--bg);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(167,139,250,0.15) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 90% 10%,rgba(216,180,254,0.12) 0%,transparent 55%);pointer-events:none;z-index:0}

.topbar{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(255,255,255,0.82);backdrop-filter:blur(20px);position:sticky;top:0;z-index:15}
.back-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;border:1px solid var(--border2);background:#fff;color:var(--p700);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-body);text-decoration:none;transition:all 0.15s}
.back-btn:hover{background:var(--p50)}
.quiz-btn{padding:9px 20px;border-radius:12px;background:linear-gradient(135deg,var(--p500),var(--p700));border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);box-shadow:0 4px 14px rgba(139,92,246,0.3);transition:all 0.2s}
.quiz-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(139,92,246,0.4)}

.content{padding:36px 32px;max-width:900px;margin:0 auto;position:relative;z-index:1}

/* Hero */
.topic-hero{background:#fff;border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:24px;box-shadow:var(--shadow);display:flex;align-items:flex-start;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.topic-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--p400),var(--p600),var(--p400))}
.topic-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--p500),var(--p700));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 18px rgba(139,92,246,0.35)}
.topic-info{flex:1}
.topic-name{font-family:var(--font-display);font-size:28px;font-weight:500;color:var(--text);margin-bottom:6px}
.topic-desc{font-size:13.5px;color:var(--text3);line-height:1.6;margin-bottom:16px}
.topic-stats{display:flex;gap:20px;flex-wrap:wrap}
.topic-stat{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text3)}
.topic-stat span{color:var(--p600);font-weight:700}

/* Mastery ring */
.mastery-ring{width:100px;height:100px;flex-shrink:0;position:relative}
.mastery-ring svg{transform:rotate(-90deg)}
.mastery-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mastery-pct{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--p600)}
.mastery-lbl{font-size:10px;color:var(--text4);text-transform:uppercase;letter-spacing:0.5px}

/* Concepts */
.concepts-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.concept-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 24px;box-shadow:var(--shadow);transition:all 0.2s;cursor:pointer;display:flex;align-items:center;gap:16px}
.concept-card:hover{border-color:var(--border2);transform:translateX(3px);box-shadow:var(--shadow-lg)}
.concept-num{width:32px;height:32px;border-radius:10px;background:var(--p50);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--p600);flex-shrink:0}
.concept-info{flex:1;min-width:0}
.concept-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px}
.concept-summary{font-size:12px;color:var(--text4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.concept-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.concept-mastery{font-size:13px;font-weight:700}
.concept-bar{width:80px;height:5px;background:var(--p100);border-radius:5px;overflow:hidden}
.concept-fill{height:100%;border-radius:5px;transition:width 0.8s ease}
.depth-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.depth-1{background:var(--green-bg);color:var(--green)}
.depth-2{background:var(--amber-bg);color:var(--amber)}
.depth-3{background:var(--red-bg);color:var(--red)}

/* Flashcard preview */
.cards-section{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cards-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--p50),rgba(255,255,255,0.95))}
.cards-header-title{font-size:14px;font-weight:600;color:var(--text)}
.cards-list{max-height:400px;overflow-y:auto}
.card-row{display:flex;align-items:flex-start;gap:14px;padding:14px 24px;border-bottom:1px solid rgba(139,92,246,0.06);transition:background 0.15s}
.card-row:last-child{border-bottom:none}
.card-row:hover{background:var(--p50)}
.card-type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.card-q{flex:1;font-size:13px;color:var(--text);line-height:1.5}
.card-conf{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;flex-shrink:0}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--text4)}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--p200);border-top-color:var(--p500);animation:spin 0.9s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate{animation:fadeUp 0.4s ease both}

/* ── Notes Library ── */
.notes-tabs{display:flex;gap:18px;margin-top:14px;border-bottom:1px solid var(--border)}
.notes-tab{padding:10px 2px;border:none;background:none;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--text4);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 0.15s}
.notes-tab.active{color:var(--p600);border-bottom-color:var(--p500)}
.notes-tab:hover:not(.active){color:var(--text2)}
.notes-tab-content{display:none}
.notes-tab-content.active{display:block}
.notes-search-row{display:flex;gap:8px;margin-top:16px}
.notes-search-row input{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;font-size:13px;font-family:var(--font-body);color:var(--text);background:var(--bg);outline:none}
.notes-search-row input:focus{border-color:var(--p400);background:#fff}
.notes-search-row button{padding:11px 18px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--p500),var(--p700));color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.notes-search-row button:disabled{opacity:0.6;cursor:default}
.notes-scope{display:flex;gap:16px;margin:10px 0 4px;font-size:12px;color:var(--text3)}
.notes-scope label{display:flex;align-items:center;gap:5px;cursor:pointer}
.notes-results{margin-top:14px;max-height:320px;overflow-y:auto}
.note-result{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note-result-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.note-result-source{font-size:11px;font-weight:700;color:var(--p600);text-transform:uppercase;letter-spacing:0.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-result-score{font-size:11px;color:var(--text4);flex-shrink:0;font-weight:600}
.note-result-text{font-size:12.5px;color:var(--text2);line-height:1.65}
.note-result-text mark{background:var(--p100);color:var(--p700);border-radius:3px;padding:0 2px;font-weight:600}
.note-result-topic{font-size:11px;color:var(--text4);margin-top:6px}
.notes-empty{color:var(--text4);font-size:13px;text-align:center;padding:24px 0}
.note-source-card{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note-source-title{font-size:13px;font-weight:600;color:var(--text)}
.note-source-meta{font-size:11px;color:var(--text4);margin-top:3px}
.note-source-preview{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.5}
.note-delete-btn{border:none;background:none;color:var(--text4);cursor:pointer;padding:6px;border-radius:8px;display:flex;flex-shrink:0;transition:all 0.15s}
.note-delete-btn:hover{background:var(--red-bg);color:var(--red)}
.notes-loading{text-align:center;padding:24px;color:var(--text4);font-size:12.5px}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="dashboard.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Dashboard
  </a>
  <div id="topbar-title" style="font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--text)">Topic Detail</div>
  <div style="display:flex;gap:10px">
    <button class="back-btn" onclick="openNotesModal()" style="background:#fff">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      My Notes
    </button>
    <button class="quiz-btn" onclick="startQuiz()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-2px;margin-right:6px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Quiz This Topic
    </button>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    Loading topic data from MongoDB…
  </div>
  <div id="main-content" style="display:none"></div>
</div>

<script>
const API   = "https://simple-python-script--anshumanbahekar.replit.app";
const TOKEN = localStorage.getItem("sm_token") || "";
const USER  = localStorage.getItem("sm_user_id") || "guest";
if(!TOKEN) window.location.href = "index.html";

function authHeaders(){ return {"Content-Type":"application/json","Authorization":"Bearer "+TOKEN}; }

const params  = new URLSearchParams(location.search);
const TOPIC_ID    = params.get("id") || "";
const TOPIC_TITLE = decodeURIComponent(params.get("title") || "Topic");

document.getElementById("topbar-title").textContent = TOPIC_TITLE;

function startQuiz(){
  localStorage.setItem("quiz_topic_id", TOPIC_ID);
  localStorage.setItem("quiz_topic_title", TOPIC_TITLE);
  window.location.href = "dashboard.html?quiz=" + TOPIC_ID;
}

async function loadTopic(){
  try{
    // Load progress for mastery data
    const res = await fetch(`${API}/progress?user_id=${USER}&token=${TOKEN}`, {headers: authHeaders()});
    const data = await res.json();

    const topic = (data.topics||[]).find(t=>t.topic_id===TOPIC_ID) || {title:TOPIC_TITLE,mastery:0,total_cards:0};
    const weak  = (data.weak_areas||[]).filter(w=>w.topic===TOPIC_TITLE);

    // Load flashcards for this topic
    const cardsRes = await fetch(`${API}/topic/cards`, {
      method:"POST", headers:authHeaders(),
      body:JSON.stringify({topic_id:TOPIC_ID,user_id:USER,token:TOKEN})
    });
    const cardsData = await cardsRes.json().catch(()=>({cards:[]}));
    const cards = cardsData.cards || [];

    render(topic, weak, cards, data);
  }catch(e){
    document.getElementById("loading").innerHTML = `<div style="color:var(--red)">Failed to load. <a href="dashboard.html" style="color:var(--p600)">Go back</a></div>`;
  }
}

function render(topic, weak, cards, allData){
  document.getElementById("loading").style.display = "none";
  const main = document.getElementById("main-content");
  main.style.display = "block";

  const mastery = Math.round(topic.mastery||0);
  const color   = mastery>=70?"var(--green)":mastery>=40?"var(--p500)":"var(--amber)";
  const circumference = 2*Math.PI*40;
  const dashOffset = circumference - (mastery/100)*circumference;

  // Group cards by concept (use question prefix as proxy)
  const conceptMap = {};
  cards.forEach(c => {
    const key = c.concept_id || "general";
    if(!conceptMap[key]) conceptMap[key] = {title: c.concept_title||"General", cards:[], mastery:0, depth:1};
    conceptMap[key].cards.push(c);
  });

  // Compute mastery per concept
  Object.values(conceptMap).forEach(cm => {
    const avgConf = cm.cards.reduce((s,c)=>s+(c.confidence_score||0),0)/Math.max(1,cm.cards.length);
    cm.mastery = Math.round(avgConf*100);
  });

  const concepts = Object.values(conceptMap).sort((a,b)=>a.mastery-b.mastery);

  // Build HTML
  main.innerHTML = `
  <div class="topic-hero animate">
    <div style="display:flex;gap:20px;align-items:flex-start;flex:1;min-width:0">
      <div class="topic-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>
      </div>
      <div class="topic-info">
        <div class="topic-name">${escapeHtml(TOPIC_TITLE)}</div>
        <div class="topic-desc">Your personalised study breakdown — powered by MongoDB Atlas + Gemini</div>
        <div class="topic-stats">
          <div class="topic-stat"><span>${topic.total_cards||cards.length}</span> flashcards</div>
          <div class="topic-stat"><span>${concepts.length}</span> concepts</div>
          <div class="topic-stat"><span>${weak.length}</span> weak areas</div>
          <div class="topic-stat"><span>${topic.reviewed||0}</span> reviewed</div>
        </div>
      </div>
    </div>
    <div class="mastery-ring">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="var(--p100)" stroke-width="8"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="${color}" stroke-width="8"
          stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"
          stroke-linecap="round" style="transition:stroke-dashoffset 1s ease"/>
      </svg>
      <div class="mastery-ring-text">
        <div class="mastery-pct" style="color:${color}">${mastery}%</div>
        <div class="mastery-lbl">mastery</div>
      </div>
    </div>
  </div>

  ${concepts.length ? `
  <div style="font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--text);margin-bottom:16px;margin-top:4px">Concept Breakdown</div>
  <div class="concepts-grid animate" style="animation-delay:0.1s">
    ${concepts.map((c,i)=>{
      const cm = c.mastery;
      const cc = cm>=70?"var(--green)":cm>=40?"var(--p500)":"var(--amber)";
      const depthLabel = c.depth<=1?"Foundational":c.depth===2?"Intermediate":"Advanced";
      const depthClass = c.depth<=1?"depth-1":c.depth===2?"depth-2":"depth-3";
      return `
      <div class="concept-card">
        <div class="concept-num">${i+1}</div>
        <div class="concept-info">
          <div class="concept-title">${escapeHtml(c.title)}</div>
          <div class="concept-summary">${c.cards.length} cards · ${cm>=70?"Strong":"Needs practice"}</div>
        </div>
        <div class="concept-right">
          <div class="concept-mastery" style="color:${cc}">${cm}%</div>
          <div class="concept-bar"><div class="concept-fill" style="width:${cm}%;background:${cc}"></div></div>
          <span class="depth-badge ${depthClass}">${depthLabel}</span>
        </div>
      </div>`;
    }).join("")}
  </div>` : `<div style="text-align:center;padding:32px;color:var(--text4);font-size:13.5px">No concept data yet — start quizzing to build your breakdown.</div>`}

  ${cards.length ? `
  <div style="font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--text);margin-bottom:16px;margin-top:28px">All Flashcards</div>
  <div class="cards-section animate" style="animation-delay:0.2s">
    <div class="cards-header">
      <div class="cards-header-title">${cards.length} cards</div>
      <div style="font-size:12px;color:var(--text4)">Sorted by confidence · lowest first</div>
    </div>
    <div class="cards-list">
      ${[...cards].sort((a,b)=>(a.confidence_score||0)-(b.confidence_score||0)).map(c=>{
        const conf = Math.round((c.confidence_score||0)*100);
        const dotColor = conf>=70?"var(--green)":conf>=40?"var(--amber)":"var(--red)";
        const confBg = conf>=70?"var(--green-bg)":conf>=40?"var(--amber-bg)":"var(--red-bg)";
        return `
        <div class="card-row">
          <div class="card-type-dot" style="background:${dotColor}"></div>
          <div class="card-q">${escapeHtml(c.question)}</div>
          <div class="card-conf" style="background:${confBg};color:${dotColor}">${conf}%</div>
        </div>`;
      }).join("")}
    </div>
  </div>` : ""}
  `;
}


document.addEventListener("DOMContentLoaded", () => {
  const el = document.getElementById("notes-topic-name");
  if(el) el.textContent = TOPIC_TITLE;
});

async function uploadNotes(){
  const text = document.getElementById("notes-text").value.trim();
  if(!text){ document.getElementById("notes-status").textContent="Please paste some notes first."; return; }
  const btn = document.getElementById("notes-upload-btn");
  btn.disabled = true;
  btn.textContent = "Embedding with Gemini…";
  document.getElementById("notes-status").textContent = "Chunking and generating embeddings…";
  try{
    const res = await fetch(`${API}/notes/upload`, {
      method:"POST", headers: authHeaders(),
      body: JSON.stringify({text, topic_id: TOPIC_ID, user_id: USER, token: TOKEN, source_name: TOPIC_TITLE + " notes"})
    });
    const data = await res.json();
    if(data.success){
      document.getElementById("notes-status").textContent = `✓ Stored ${data.chunks_stored} chunks in MongoDB Atlas Vector Search. The AI will now use these notes when teaching ${TOPIC_TITLE}.`;
      document.getElementById("notes-status").style.color = "var(--green)";
      document.getElementById("notes-text").value = "";
    } else {
      document.getElementById("notes-status").textContent = "Error: " + (data.error||"failed");
      document.getElementById("notes-status").style.color = "var(--red)";
    }
  } catch(e){
    document.getElementById("notes-status").textContent = "Could not reach server.";
  }
  btn.disabled = false;
  btn.textContent = "Save & Embed Notes";
}

loadTopic();

// ─────────────────────────────────────────
//  NOTES LIBRARY (Upload / Search / My Notes)
// ─────────────────────────────────────────
let notesSearchScope = "topic";
let notesLibraryLoaded = false;

function openNotesModal(){
  document.getElementById("notes-modal").style.display = "flex";
  switchNotesTab("upload");
}

function switchNotesTab(tab){
  document.querySelectorAll(".notes-tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  document.querySelectorAll(".notes-tab-content").forEach(c=>c.classList.remove("active"));
  document.getElementById("notes-tab-"+tab).classList.add("active");
  if(tab==="library") loadNotesLibrary();
  if(tab==="search") document.getElementById("notes-search-input").focus();
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Highlights query words inside a snippet (HTML-escaped first)
function highlightText(text, query){
  let escaped = escapeHtml(text);
  const words = [...new Set(query.toLowerCase().split(/\s+/).filter(w=>w.length>2))];
  words.forEach(w=>{
    const re = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`, "gi");
    escaped = escaped.replace(re, "<mark>$1</mark>");
  });
  return escaped;
}

async function runNotesSearch(){
  const query = document.getElementById("notes-search-input").value.trim();
  const resultsEl = document.getElementById("notes-results");
  if(!query){ resultsEl.innerHTML = `<div class="notes-empty">Type something to search your notes.</div>`; return; }

  const btn = document.getElementById("notes-search-btn");
  btn.disabled = true; btn.textContent = "Searching…";
  resultsEl.innerHTML = `<div class="notes-loading">Running semantic search over your notes…</div>`;

  try{
    const res = await fetch(`${API}/notes/search`, {
      method:"POST", headers: authHeaders(),
      body: JSON.stringify({
        query,
        topic_id: notesSearchScope==="topic" ? TOPIC_ID : null,
        user_id: USER, token: TOKEN, limit: 6
      })
    });
    const data = await res.json();
    const results = data.results || [];
    resultsEl.innerHTML = results.length ? results.map(r=>`
      <div class="note-result">
        <div class="note-result-header">
          <div class="note-result-source">${escapeHtml(r.source || "Notes")}</div>
          <div class="note-result-score">${Math.round((r.score||0)*100)}% match</div>
        </div>
        <div class="note-result-text">${highlightText((r.text||"").slice(0,320) + ((r.text||"").length>320?"…":""), query)}</div>
        ${notesSearchScope==="all" ? `<div class="note-result-topic">From: ${escapeHtml(r.topic_title || "General")}</div>` : ""}
      </div>`).join("")
    : `<div class="notes-empty">No matches found${notesSearchScope==="topic" ? " in this topic's notes" : ""}. Try different wording, or check "All my notes".</div>`;
  } catch(e){
    resultsEl.innerHTML = `<div class="notes-empty">Could not reach server.</div>`;
  }
  btn.disabled = false; btn.textContent = "Search";
}

async function loadNotesLibrary(){
  const listEl = document.getElementById("notes-library-list");
  listEl.innerHTML = `<div class="notes-loading">Loading your uploaded notes…</div>`;
  try{
    const res = await fetch(`${API}/notes/list?topic_id=${TOPIC_ID}&user_id=${USER}&token=${TOKEN}`, {headers: authHeaders()});
    const data = await res.json();
    const sources = data.sources || [];
    listEl.innerHTML = sources.length ? sources.map(s=>`
      <div class="note-source-card">
        <div style="flex:1">
          <div class="note-source-title">${escapeHtml(s.source)}</div>
          <div class="note-source-meta">${s.chunk_count} chunk${s.chunk_count===1?"":"s"} · ${s.char_count.toLocaleString()} characters${s.created_at ? " · "+new Date(s.created_at).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : ""}</div>
          <div class="note-source-preview">${escapeHtml(s.preview)}${s.preview.length>=180?"…":""}</div>
        </div>
        <button class="note-delete-btn" title="Delete these notes" onclick="deleteNoteSource('${s.source.replace(/'/g,"\\'")}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>`).join("")
    : `<div class="notes-empty">No notes uploaded for this topic yet. Switch to the Upload tab to add some.</div>`;
  } catch(e){
    listEl.innerHTML = `<div class="notes-empty">Could not reach server.</div>`;
  }
}

async function deleteNoteSource(source){
  if(!confirm(`Delete all notes from "${source}"? This can't be undone.`)) return;
  try{
    await fetch(`${API}/notes/delete`, {
      method:"POST", headers: authHeaders(),
      body: JSON.stringify({source, topic_id: TOPIC_ID, user_id: USER, token: TOKEN})
    });
  } catch(e){}
  loadNotesLibrary();
}

</script>

<!-- Notes Library Modal -->
<div id="notes-modal" style="display:none;position:fixed;inset:0;background:rgba(26,5,51,0.5);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:20px;padding:28px;width:560px;max-width:92vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div style="font-family:var(--font-display);font-size:22px;font-weight:500;color:var(--text)">Notes Library</div>
      <button onclick="document.getElementById('notes-modal').style.display='none'" style="width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text4)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="font-size:12.5px;color:var(--text3)">For <strong id="notes-topic-name"></strong></div>

    <div class="notes-tabs">
      <button class="notes-tab active" data-tab="upload" onclick="switchNotesTab('upload')">Upload</button>
      <button class="notes-tab" data-tab="search" onclick="switchNotesTab('search')">Search</button>
      <button class="notes-tab" data-tab="library" onclick="switchNotesTab('library')">My Notes</button>
    </div>

    <div style="overflow-y:auto;flex:1;margin-top:4px">
      <!-- Upload tab -->
      <div id="notes-tab-upload" class="notes-tab-content active">
        <div style="font-size:13px;color:var(--text3);line-height:1.6;margin:14px 0">
          Paste your own notes, textbook excerpts, or lecture material. The AI will use these as the primary source when teaching this topic.
        </div>
        <textarea id="notes-text" placeholder="Paste your notes here…" style="width:100%;min-height:160px;border:1.5px solid var(--border);border-radius:12px;padding:14px;font-size:13px;font-family:var(--font-body);color:var(--text);background:var(--bg);outline:none;resize:vertical;line-height:1.6" onfocus="this.style.borderColor='var(--p400)';this.style.background='#fff'" onblur="this.style.borderColor='';this.style.background='var(--bg)'"></textarea>
        <div id="notes-status" style="font-size:12px;color:var(--text4);margin-top:8px;min-height:18px"></div>
        <button onclick="uploadNotes()" id="notes-upload-btn" style="width:100%;margin-top:10px;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--p500),var(--p700));border:none;color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-body);box-shadow:0 4px 14px rgba(139,92,246,0.3)">
          Save & Embed Notes
        </button>
      </div>

      <!-- Search tab -->
      <div id="notes-tab-search" class="notes-tab-content">
        <div class="notes-search-row">
          <input id="notes-search-input" type="text" placeholder="Search your notes — e.g. &quot;chain rule&quot;, &quot;mitosis stages&quot;…" onkeydown="if(event.key==='Enter')runNotesSearch()">
          <button id="notes-search-btn" onclick="runNotesSearch()">Search</button>
        </div>
        <div class="notes-scope">
          <label><input type="radio" name="notes-scope" value="topic" checked onchange="notesSearchScope='topic'"> This topic</label>
          <label><input type="radio" name="notes-scope" value="all" onchange="notesSearchScope='all'"> All my notes</label>
        </div>
        <div id="notes-results" class="notes-results"></div>
      </div>

      <!-- Library tab -->
      <div id="notes-tab-library" class="notes-tab-content">
        <div style="font-size:12.5px;color:var(--text3);margin:14px 0 4px">Sources you've uploaded for this topic</div>
        <div id="notes-library-list"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
